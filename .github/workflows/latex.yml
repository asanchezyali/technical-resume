name: Publish CV

on:
  push:
    branches: [main]
    paths:
      - 'variants/**'
      - 'README.md'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

# The published CV is a hand-curated file in variants/, never generated from the data at
# build time. Change PUBLISHED_VARIANT to publish a different one.
env:
  PUBLISHED_VARIANT: ai-fullstack
  PUBLISHED_NAME: AlejandroSanchezYaliAIFullStack
  # Must match SOURCE_DATE_EPOCH in src/latex_compiler.py so CI and local builds
  # produce byte-identical PDFs and generated/ stays out of the diff
  SOURCE_DATE_EPOCH: "1577836800"
  FORCE_SOURCE_DATE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compile every variant
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: variants
          root_file: |
            ai-engineer.tex
            ai-fullstack.tex
            product-engineer.tex
            senior-fullstack.tex

      - name: Copy PDFs to generated/ under their recruiter-facing names
        run: |
          mkdir -p generated
          cp variants/ai-engineer.pdf      generated/AlejandroSanchezYaliAIEngineer.pdf
          cp variants/ai-fullstack.pdf     generated/AlejandroSanchezYaliAIFullStack.pdf
          cp variants/product-engineer.pdf generated/AlejandroSanchezYaliProductEngineer.pdf
          cp variants/senior-fullstack.pdf generated/AlejandroSanchezYaliSeniorFullStack.pdf

      # Must run before the branch switch below: variants/ does not exist on technical-resume
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PUBLISHED_NAME }}
          path: generated/${{ env.PUBLISHED_NAME }}.pdf

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      # Keeps generated/ in sync when a variant is edited without running `agent.py build`
      - name: Commit refreshed PDFs to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet -- generated/; then
            echo "generated/ already up to date"
          else
            git add generated/
            git commit -m "🔧 chore: refresh CV PDFs - ${{ steps.date.outputs.date }}"
            git push origin main
          fi

      - name: Stage files for the published branch
        run: |
          cp "variants/${PUBLISHED_VARIANT}.pdf" "/tmp/${PUBLISHED_NAME}.pdf"
          cp README.md /tmp/README.md

      - name: Publish to technical-resume branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git clean -fdx
          git checkout -- .

          if git show-ref --verify --quiet refs/remotes/origin/technical-resume; then
            git checkout technical-resume
          else
            git checkout --orphan technical-resume
            git rm -rf .
          fi

          cp "/tmp/${PUBLISHED_NAME}.pdf" "./${PUBLISHED_NAME}.pdf"
          # Kept so links already shared in applications do not break
          cp "/tmp/${PUBLISHED_NAME}.pdf" ./technical_resume.pdf
          cp /tmp/README.md ./README.md

          git add "${PUBLISHED_NAME}.pdf" technical_resume.pdf README.md
          git commit -m "🚀 Update resume - ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          git push origin technical-resume

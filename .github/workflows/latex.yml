name: Publish CV

on:
  push:
    branches: [main]
    paths:
      - 'variants/**'
      - 'README.md'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

# The published CV is variants/ai-fullstack.tex — a hand-curated file, not generated output.
# Change PUBLISHED_VARIANT to publish a different one.
env:
  PUBLISHED_VARIANT: ai-fullstack

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile CV to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ env.PUBLISHED_VARIANT }}.tex
          working_directory: variants

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Publish PDF and README to technical-resume branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          cp "variants/${PUBLISHED_VARIANT}.pdf" /tmp/technical_resume.pdf
          cp README.md /tmp/README.md

          git clean -fdx
          git checkout -- .

          if git show-ref --verify --quiet refs/remotes/origin/technical-resume; then
            git checkout technical-resume
          else
            git checkout --orphan technical-resume
            git rm -rf .
          fi

          cp /tmp/technical_resume.pdf ./technical_resume.pdf
          cp /tmp/README.md ./README.md

          git add technical_resume.pdf README.md
          git commit -m "🚀 Update resume - ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          git push origin technical-resume

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Technical Resume
          path: variants/${{ env.PUBLISHED_VARIANT }}.pdf
